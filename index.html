<!DOCTYPE html>
<html>
<head>
    <title>PulseJS Demo</title>
</head>

<body>

    <div id="app"></div>

    <script type="module" src="/main.js"></script>

</body>
</html>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.dashboard {
    min-height: 100vh;
    padding: 50px;
    background: linear-gradient(135deg, #0f172a, #172554);
}

.header {
    margin-bottom: 40px;
}

.header h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

.header p {
    color: #94a3b8;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.card {
    padding: 30px;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
}

.card h2 {
    color: #94a3b8;
    font-size: 16px;
}

.card p {
    font-size: 42px;
    font-weight: bold;
    margin: 0;
}

.status {
    margin-top: 30px;
    padding: 15px 20px;
    border-radius: 12px;
    background: rgba(34,197,94,0.1);
    color: #4ade80;
}
</style>
